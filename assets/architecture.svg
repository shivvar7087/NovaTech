<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" rx="14" fill="url(#bgGrad)"/>
  <rect width="958" height="478" x="1" y="1" rx="13" fill="none" stroke="#334155" stroke-opacity="0.6" stroke-width="1.5"/>

  <!-- Diagram Title -->
  <text x="480" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">End-to-End Intelligence &amp; Verification Architecture</text>
  <text x="480" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">Separation of Concerns: Language Models Understand Intent · Deterministic Engines Verify Math</text>

  <!-- Step 1: Frontend Client -->
  <g transform="translate(40, 90)" filter="url(#shadow)">
    <rect width="250" height="340" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="250" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="125" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle">1. React JSX Frontend</text>

    <!-- Sub-elements -->
    <g transform="translate(15, 60)">
      <rect width="220" height="50" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#f1f5f9">💬 Natural Language Chat</text>
      <text x="12" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Quick suggestions &amp; building filters</text>
    </g>

    <g transform="translate(15, 125)">
      <rect width="220" height="50" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#f1f5f9">📁 CSV Dataset Manager</text>
      <text x="12" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Drag-and-drop &amp; summary stats</text>
    </g>

    <g transform="translate(15, 190)">
      <rect width="220" height="50" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#f1f5f9">📊 Recharts Visualization</text>
      <text x="12" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Bar, Line, Area, and Pie switches</text>
    </g>

    <g transform="translate(15, 255)">
      <rect width="220" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#f1f5f9">🎯 Answer Card &amp; Table</text>
      <text x="12" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Highlighted KPI &amp; audit caveats</text>
      <text x="12" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#10b981">Zero client-side calculations</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(295, 250)">
    <line x1="0" y1="0" x2="55" y2="0" stroke="url(#arrowGrad)" stroke-width="2.5" stroke-dasharray="4,4"/>
    <polygon points="55,0 47,-5 47,5" fill="#38bdf8"/>
    <text x="27" y="-10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#a5b4fc" text-anchor="middle">POST /api/query</text>
  </g>

  <!-- Step 2: FastAPI Gateway -->
  <g transform="translate(355, 90)" filter="url(#shadow)">
    <rect width="250" height="340" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5"/>
    <rect width="250" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="125" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#10b981" text-anchor="middle">2. FastAPI Orchestrator</text>

    <!-- Sub-elements -->
    <g transform="translate(15, 60)">
      <rect width="220" height="65" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#f1f5f9">1️⃣ Question Normalization</text>
      <text x="12" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Validates building &amp; metric bounds</text>
      <text x="12" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#38bdf8">Passes context to AI / Rule Engine</text>
    </g>

    <g transform="translate(15, 140)">
      <rect width="220" height="65" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#f1f5f9">2️⃣ Execution Dispatcher</text>
      <text x="12" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Sends parsed intent to Pandas</text>
      <text x="12" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#fbbf24">Enforces mathematical isolation</text>
    </g>

    <g transform="translate(15, 220)">
      <rect width="220" height="95" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#f1f5f9">3️⃣ Narrative &amp; Audit Assembler</text>
      <text x="12" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Cites verified values in executive summary</text>
      <text x="12" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Generates data caveats &amp; notes</text>
      <text x="12" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#34d399">✓ Verified Response Payload</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(610, 250)">
    <line x1="0" y1="0" x2="55" y2="0" stroke="url(#arrowGrad)" stroke-width="2.5" stroke-dasharray="4,4"/>
    <polygon points="55,0 47,-5 47,5" fill="#38bdf8"/>
    <text x="27" y="-10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#a5b4fc" text-anchor="middle">Execution</text>
  </g>

  <!-- Step 3: Computational Backing -->
  <g transform="translate(670, 90)" filter="url(#shadow)">
    <rect width="250" height="340" rx="10" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.5"/>
    <rect width="250" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="125" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#818cf8" text-anchor="middle">3. Engine &amp; AI Layer</text>

    <!-- Sub-elements -->
    <g transform="translate(15, 60)">
      <rect width="220" height="110" rx="6" fill="#0f172a" stroke="#ec4899" stroke-width="1"/>
      <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f472b6">🤖 Gemma 4 (Ollama)</text>
      <text x="12" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">• Extracts intent &amp; metric entities</text>
      <text x="12" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">• Synthesizes human explanation</text>
      <text x="12" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#ef4444">✕ NEVER calculates numbers</text>
      <text x="12" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#fbbf24">Fallback: Built-in Rule Engine</text>
    </g>

    <g transform="translate(15, 185)">
      <rect width="220" height="130" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
      <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">⚡ Python Pandas Engine</text>
      <text x="12" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">• Totals, Averages, Medians</text>
      <text x="12" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">• Facility Rankings &amp; Shares</text>
      <text x="12" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">• Delta &amp; % Comparisons</text>
      <text x="12" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">• Daily Time-series trends</text>
      <text x="12" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#34d399">✓ 100% Certified Numerical Accuracy</text>
    </g>
  </g>

  <!-- Footer note -->
  <text x="480" y="458" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Every calculation displayed in the UI is computed deterministically in Python before being presented.</text>
</svg>


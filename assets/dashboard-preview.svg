<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="560">
  <defs>
    <linearGradient id="dbBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="barPeakGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <filter id="cardShadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- App Window Container -->
  <rect width="960" height="560" rx="12" fill="url(#dbBg)"/>
  <rect width="958" height="558" x="1" y="1" rx="11" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Window Header Bar -->
  <rect width="960" height="32" rx="12" fill="#1e293b"/>
  <rect width="960" height="12" y="20" fill="#1e293b"/>
  <circle cx="20" cy="16" r="5" fill="#ef4444"/>
  <circle cx="36" cy="16" r="5" fill="#f59e0b"/>
  <circle cx="52" cy="16" r="5" fill="#10b981"/>
  <text x="480" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Campus Resource Intelligence Dashboard — http://localhost:5173</text>

  <!-- Navbar -->
  <g transform="translate(0, 32)">
    <rect width="960" height="48" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <!-- Brand -->
    <text x="24" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">⚡ Campus Resource Intelligence</text>
    <text x="270" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#818cf8">React · FastAPI · Pandas · Gemma 4</text>

    <!-- Status Badges -->
    <g transform="translate(620, 12)">
      <rect width="180" height="24" rx="12" fill="#1e293b" stroke="#6366f1" stroke-opacity="0.5"/>
      <text x="90" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#a5b4fc" text-anchor="middle">📁 campus_electricity.csv</text>
    </g>
    <g transform="translate(810, 12)">
      <rect width="130" height="24" rx="12" fill="#064e3b" stroke="#10b981" stroke-opacity="0.5"/>
      <circle cx="14" cy="12" r="3.5" fill="#10b981"/>
      <text x="70" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#34d399" text-anchor="middle">API Connected</text>
    </g>
  </g>

  <!-- Left Sidebar (Dataset Upload & Stats) -->
  <g transform="translate(20, 96)" filter="url(#cardShadow)">
    <rect width="250" height="444" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#94a3b8">📊 DATASET MANAGEMENT</text>

    <!-- Upload Dropzone -->
    <g transform="translate(15, 42)">
      <rect width="220" height="85" rx="8" fill="#0f172a" stroke="#6366f1" stroke-dasharray="4,4" stroke-width="1.5"/>
      <text x="110" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" text-anchor="middle">📁</text>
      <text x="110" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#f8fafc" text-anchor="middle">Click or drop CSV dataset</text>
      <text x="110" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">Normalized: kwh, building, timestamp...</text>
    </g>

    <!-- Active Dataset Stats Grid -->
    <g transform="translate(15, 140)">
      <rect width="220" height="130" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">TOTAL RECORDS</text>
      <text x="16" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">360 readings</text>

      <text x="120" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">BUILDINGS</text>
      <text x="120" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">6 facilities</text>

      <line x1="16" y1="60" x2="204" y2="60" stroke="#334155" stroke-width="0.7"/>

      <text x="16" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">TOTAL ENERGY</text>
      <text x="16" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#818cf8">73,828.73 kWh</text>

      <text x="120" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">TOTAL COST</text>
      <text x="120" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#34d399">$9,846.63</text>
    </g>

    <!-- Control Buttons -->
    <g transform="translate(15, 282)">
      <rect width="105" height="32" rx="6" fill="#1e293b" stroke="#6366f1" stroke-width="1"/>
      <text x="52" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#a5b4fc" text-anchor="middle">👁️ View Records</text>

      <rect width="105" height="32" x="115" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="167" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1" text-anchor="middle">🔄 Reset Default</text>
    </g>

    <!-- Architecture Guarantee Card -->
    <g transform="translate(15, 328)">
      <rect width="220" height="98" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#38bdf8">🛡️ Core Principle</text>
      <text x="12" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">• Gemma: Intent parsing only</text>
      <text x="12" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">• Pandas: 100% of calculations</text>
      <text x="12" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">• Certified numerical truth</text>
      <text x="12" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#10b981">✓ Zero AI hallucinations in math</text>
    </g>
  </g>

  <!-- Right Main Panel -->
  <g transform="translate(285, 96)">
    <!-- Chat / Query Input Box -->
    <g filter="url(#cardShadow)">
      <rect width="655" height="94" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#94a3b8">💬 RESOURCE INTELLIGENCE QUERY</text>

      <g transform="translate(16, 34)">
        <rect width="130" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">All Buildings ▼</text>

        <rect width="440" height="34" x="140" rx="6" fill="#0f172a" stroke="#6366f1" stroke-width="1.5"/>
        <text x="155" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#f8fafc">Which building consumes the most electricity?</text>

        <rect width="44" height="34" x="590" rx="6" fill="#6366f1"/>
        <text x="612" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#fff" text-anchor="middle">⚡</text>
      </g>

      <!-- Quick Chips -->
      <g transform="translate(16, 75)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8">
        <text x="0" y="10">Popular:</text>
        <text x="45" y="10" fill="#818cf8">[Compare Science vs Engineering]</text>
        <text x="215" y="10" fill="#818cf8">[Show daily trend]</text>
        <text x="315" y="10" fill="#818cf8">[Rank by total cost]</text>
        <text x="415" y="10" fill="#818cf8">[Average weekend usage]</text>
      </g>
    </g>

    <!-- Verified Answer Card -->
    <g transform="translate(0, 106)" filter="url(#cardShadow)">
      <rect width="655" height="152" rx="10" fill="#1e293b" stroke="#6366f1" stroke-opacity="0.6" stroke-width="1.5"/>
      
      <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#a5b4fc">🎯 EVIDENCE-BACKED INTELLIGENCE BRIEFING</text>
      
      <!-- Badges -->
      <g transform="translate(370, 12)">
        <rect width="80" height="20" rx="4" fill="#312e81"/>
        <text x="40" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#a5b4fc" text-anchor="middle">RANKING</text>

        <rect width="100" height="20" x="88" rx="4" fill="#075985"/>
        <text x="138" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#38bdf8" text-anchor="middle">KWH USAGE</text>

        <rect width="70" height="20" x="196" rx="4" fill="#064e3b"/>
        <text x="231" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#34d399" text-anchor="middle">⏱️ 38 ms</text>
      </g>

      <!-- Big Metric Callout Box -->
      <g transform="translate(16, 38)">
        <rect width="250" height="98" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">VERIFIED CALCULATION (PANDAS)</text>
        <text x="16" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#818cf8">17,487.69 <tspan font-size="14" font-weight="500" fill="#94a3b8">kWh</tspan></text>
        <text x="16" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f43f5e">Highest: Science Center</text>
        <text x="16" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#34d399">📈 +113.3% vs lowest (North Dormitory)</text>
      </g>

      <!-- Executive Narrative & Caveats -->
      <g transform="translate(280, 42)">
        <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#94a3b8">EXECUTIVE SUMMARY (GEMMA 4):</text>
        <text x="0" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f8fafc">Based on verified campus meter readings, Science Center ranks highest in cumulative</text>
        <text x="0" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f8fafc">consumption at 17,487.69 kWh (23.7% of campus total). North Dormitory recorded 8,200 kWh.</text>

        <!-- Audit Banner -->
        <rect width="360" height="34" y="62" rx="6" fill="#451a03" fill-opacity="0.4" stroke="#d97706" stroke-opacity="0.4" stroke-width="1"/>
        <text x="10" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#fbbf24">🛡️ Audit: Computed over 360 intervals. Difference from baseline is 9,287.59 kWh.</text>
        <text x="10" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#fde68a">Readings synchronized across identical meteorological conditions.</text>
      </g>
    </g>

    <!-- Recharts Bar Chart Preview -->
    <g transform="translate(0, 270)" filter="url(#cardShadow)">
      <rect width="655" height="170" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#94a3b8">📈 BUILDING RANKING BY ELECTRICITY CONSUMPTION (RECHARTS)</text>

      <!-- Chart Type Switches -->
      <g transform="translate(450, 10)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5">
        <rect width="45" height="20" rx="4" fill="#312e81" stroke="#6366f1" stroke-width="1"/>
        <text x="22" y="14" fill="#818cf8" text-anchor="middle">Bar</text>
        <rect width="45" height="20" x="50" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="72" y="14" fill="#94a3b8" text-anchor="middle">Area</text>
        <rect width="45" height="20" x="100" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="122" y="14" fill="#94a3b8" text-anchor="middle">Line</text>
        <rect width="45" height="20" x="150" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="172" y="14" fill="#94a3b8" text-anchor="middle">Pie</text>
      </g>

      <!-- Chart Bars -->
      <g transform="translate(60, 42)">
        <!-- Grid lines -->
        <line x1="0" y1="20" x2="560" y2="20" stroke="#334155" stroke-dasharray="3,3" stroke-width="0.8"/>
        <line x1="0" y1="55" x2="560" y2="55" stroke="#334155" stroke-dasharray="3,3" stroke-width="0.8"/>
        <line x1="0" y1="90" x2="560" y2="90" stroke="#334155" stroke-dasharray="3,3" stroke-width="0.8"/>

        <!-- Bar 1: Science Center (17,487 kWh - Highest) -->
        <rect x="20" y="10" width="55" height="80" rx="4" fill="url(#barPeakGrad)"/>
        <text x="47" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#f43f5e" text-anchor="middle">17,487</text>
        <text x="47" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1" text-anchor="middle">Science Ctr</text>

        <!-- Bar 2: Engineering Hall (15,595 kWh) -->
        <rect x="110" y="20" width="55" height="70" rx="4" fill="url(#barGrad)"/>
        <text x="137" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#a5b4fc" text-anchor="middle">15,595</text>
        <text x="137" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1" text-anchor="middle">Engineering</text>

        <!-- Bar 3: Student Union (12,822 kWh) -->
        <rect x="200" y="32" width="55" height="58" rx="4" fill="url(#barGrad)"/>
        <text x="227" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#a5b4fc" text-anchor="middle">12,822</text>
        <text x="227" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1" text-anchor="middle">Student Union</text>

        <!-- Bar 4: Athletics Complex (11,145 kWh) -->
        <rect x="290" y="40" width="55" height="50" rx="4" fill="url(#barGrad)"/>
        <text x="317" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#a5b4fc" text-anchor="middle">11,145</text>
        <text x="317" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1" text-anchor="middle">Athletics</text>

        <!-- Bar 5: Main Library (8,577 kWh) -->
        <rect x="380" y="52" width="55" height="38" rx="4" fill="url(#barGrad)"/>
        <text x="407" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#a5b4fc" text-anchor="middle">8,577</text>
        <text x="407" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1" text-anchor="middle">Library</text>

        <!-- Bar 6: North Dormitory (8,200 kWh) -->
        <rect x="470" y="54" width="55" height="36" rx="4" fill="#10b981"/>
        <text x="497" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#34d399" text-anchor="middle">8,200</text>
        <text x="497" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1" text-anchor="middle">North Dorm</text>
      </g>
    </g>
  </g>
</svg>


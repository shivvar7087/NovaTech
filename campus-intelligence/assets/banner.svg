<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="260">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="260" rx="16" fill="url(#bgGradient)"/>
  <rect width="960" height="260" rx="16" fill="url(#glow)"/>
  <rect width="958" height="258" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-opacity="0.6" stroke-width="1.5"/>

  <!-- Grid decoration lines -->
  <g opacity="0.12" stroke="#94a3b8" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="260"/>
    <line x1="200" y1="0" x2="200" y2="260"/>
    <line x1="340" y1="0" x2="340" y2="260"/>
    <line x1="480" y1="0" x2="480" y2="260"/>
    <line x1="620" y1="0" x2="620" y2="260"/>
    <line x1="760" y1="0" x2="760" y2="260"/>
    <line x1="900" y1="0" x2="900" y2="260"/>
    <line x1="0" y1="65" x2="960" y2="65"/>
    <line x1="0" y1="130" x2="960" y2="130"/>
    <line x1="0" y1="195" x2="960" y2="195"/>
  </g>

  <!-- Icon Circle -->
  <g transform="translate(60, 48)">
    <circle cx="36" cy="36" r="36" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
    <path d="M38 16 L22 38 L34 38 L30 56 L48 32 L36 32 Z" fill="#38bdf8"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="150" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="url(#titleGradient)">Campus Resource Intelligence Assistant</text>
  <text x="150" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8">Interactive Web Intelligence with Gemma 4, Verified Pandas Numerical Analysis &amp; Recharts</text>

  <!-- Key Architecture Guarantee Banner -->
  <g transform="translate(60, 134)">
    <rect width="840" height="42" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
    <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#34d399">✓ Zero Hallucinations:</text>
    <text x="165" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#cbd5e1">Gemma 4 interprets intent &amp; explains findings · Python Pandas computes 100% of mathematical figures</text>
  </g>

  <!-- Technology Badges -->
  <g transform="translate(60, 196)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">
    <!-- React -->
    <g transform="translate(0, 0)">
      <rect width="90" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="45" y="17" fill="#38bdf8" text-anchor="middle">React 18</text>
    </g>
    <!-- Vite -->
    <g transform="translate(98, 0)">
      <rect width="75" height="26" rx="13" fill="#1e293b" stroke="#818cf8" stroke-width="1"/>
      <text x="37" y="17" fill="#a5b4fc" text-anchor="middle">Vite 5</text>
    </g>
    <!-- FastAPI -->
    <g transform="translate(181, 0)">
      <rect width="85" height="26" rx="13" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
      <text x="42" y="17" fill="#34d399" text-anchor="middle">FastAPI</text>
    </g>
    <!-- Pandas -->
    <g transform="translate(274, 0)">
      <rect width="85" height="26" rx="13" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
      <text x="42" y="17" fill="#fbbf24" text-anchor="middle">Pandas</text>
    </g>
    <!-- Gemma 4 -->
    <g transform="translate(367, 0)">
      <rect width="95" height="26" rx="13" fill="#1e293b" stroke="#ec4899" stroke-width="1"/>
      <text x="47" y="17" fill="#f472b6" text-anchor="middle">Gemma 4</text>
    </g>
    <!-- Ollama -->
    <g transform="translate(470, 0)">
      <rect width="80" height="26" rx="13" fill="#1e293b" stroke="#cbd5e1" stroke-width="1"/>
      <text x="40" y="17" fill="#e2e8f0" text-anchor="middle">Ollama</text>
    </g>
    <!-- Recharts -->
    <g transform="translate(558, 0)">
      <rect width="95" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="47" y="17" fill="#38bdf8" text-anchor="middle">Recharts</text>
    </g>
    <!-- Status -->
    <g transform="translate(661, 0)">
      <rect width="179" height="26" rx="13" fill="#1e293b" stroke="#22c55e" stroke-width="1"/>
      <circle cx="16" cy="13" r="4" fill="#22c55e"/>
      <text x="95" y="17" fill="#4ade80" text-anchor="middle">Production Ready</text>
    </g>
  </g>
</svg>

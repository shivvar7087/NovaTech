# Netlify Configuration for Campus Resource Intelligence Frontend
[build]
  base = "campus-intelligence/frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20.11.0"

# OPTION 1 (Recommended for Netlify + Render split deployment):
# If your backend is deployed on Render, set VITE_API_BASE_URL in Netlify
# Site configuration > Environment variables:
#   VITE_API_BASE_URL = https://your-backend-service.onrender.com/api
#
# OPTION 2 (Netlify Transparent Proxy to Render):
# Uncomment the block below and replace with your Render backend URL:
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-backend-service.onrender.com/api/:splat"
#   status = 200
#   force = true

# SPA Fallback for client routing (always keep this at the bottom)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200


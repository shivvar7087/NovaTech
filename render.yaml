# ==============================================================================
# Render Blueprint Configuration (Infrastructure-as-Code)
# https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Backend Web Service (FastAPI API)
  # ----------------------------------------------------------------------------
  - type: web
    name: campus-resource-intelligence-api
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: "bash build.sh"
    startCommand: "uvicorn app.main:app --app-dir campus-intelligence/backend --host 0.0.0.0 --port $PORT"
    healthCheckPath: "/health"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: NODE_VERSION
        value: 20.11.0
      - key: OLLAMA_TIMEOUT
        value: "4.0"

